name: CI/CD Pipeline - Razorpay Return-Risk Intelligence Engine

on:
  push:
    branches: [ main, master, "phase/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-test-suite:
    name: Python Test Suite & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install prometheus-client prometheus-fastapi-instrumentator locust

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v

      - name: Run Phase Verification Scripts
        run: |
          python scripts/verify_phase7.py
          python scripts/verify_phase8.py
          python scripts/verify_phase9.py

  frontend-build:
    name: Next.js Frontend Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Next.js Production Artifacts
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  docker-compose-validation:
    name: Docker Compose & Infrastructure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Validate Prometheus Scrape Config
        run: |
          docker run --rm -v $(pwd)/deployment/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus:latest promtool check config /etc/prometheus/prometheus.yml
