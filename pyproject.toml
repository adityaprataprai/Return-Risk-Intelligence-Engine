[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "return-risk-intelligence-engine"
version = "0.1.0"
description = "Razorpay Return-Risk Intelligence Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Razorpay Risk Intelligence Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "polars>=0.20.0",
    "duckdb>=0.10.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "shap>=0.45.0",
    "redis>=5.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "joblib>=1.3.0",
    "scikit-learn>=1.4.0",
    "pyarrow>=15.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = [".", "src"]

