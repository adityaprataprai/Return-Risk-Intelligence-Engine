version: "1.0.0"
description: "Return-Risk Reason Code and Semantic Grouping Configuration"

groups:
  graph_abuse:
    display_name: "Network & Identity Graph Abuse"
    description: "Multi-account linkage across shared devices, addresses, or payment instruments."
    features:
      - linked_accounts_1hop
      - linked_accounts_2hop
      - shared_device_accounts
      - shared_address_accounts
      - shared_payment_accounts
      - high_return_neighbor_count
      - connected_component_size

  velocity:
    display_name: "Order & Return Velocity"
    description: "Rapid burst of returns or orders across short temporal windows (24h/7d/30d)."
    features:
      - returns_24h
      - returns_7d
      - returns_30d
      - orders_24h
      - orders_7d
      - orders_30d
      - device_returns_30d
      - address_returns_30d
      - payment_returns_30d

  return_behavior:
    display_name: "Return Behavioral Patterns"
    description: "Historical return rates, wardrobing risk, rapid return turnaround, or category skew."
    features:
      - return_rate_30d
      - return_rate_all_time
      - total_returns_all_time
      - days_to_return_current
      - avg_days_to_return_user
      - wardrobing_risk_score
      - category_return_rate_baseline
      - user_category_return_rate_diff
      - device_return_rate_30d

  transaction_value:
    display_name: "Transaction & Return Economics"
    description: "Excessive financial exposure, refund-to-order ratio, or negative unit margin."
    features:
      - order_amount
      - refund_amount
      - cogs
      - shipping_cost
      - return_shipping_cost
      - handling_cost
      - restocking_cost
      - salvage_value_percentage
      - estimated_return_loss
      - total_spend_30d
      - refund_amount_30d
      - refund_ratio_30d
      - item_price_vs_user_avg

  sequence:
    display_name: "Temporal Order-Return Sequence"
    description: "Inter-event timing between purchase, prior returns, and current claim."
    features:
      - days_since_last_order
      - days_since_last_return
      - total_orders_all_time

  evidence_quality:
    display_name: "Evidence Quality & Account Maturity"
    description: "Cold-start indicators and data density. Strictly informational, never punitive."
    is_punitive: false
    features:
      - is_first_purchase
      - account_age_hours
      - account_age_under_24h
      - has_prior_orders
      - has_prior_returns
      - user_history_count
      - baseline_support_count
      - used_category_fallback
      - device_users_count
      - address_users_count
      - payment_users_count

reason_codes:
  RC_NETWORK_ABUSE:
    title: "Multi-Account Identity Network Abuse"
    group: "graph_abuse"
    severity: "HIGH"
    priority: 1
    template: "Customer account is linked to {linked_accounts_1hop} account(s) via shared identity infrastructure (connected component size {connected_component_size})."
    features:
      - linked_accounts_1hop
      - linked_accounts_2hop
      - connected_component_size
      - high_return_neighbor_count

  RC_SHARED_DEVICE_RISK:
    title: "High-Risk Shared Device Footprint"
    group: "graph_abuse"
    severity: "HIGH"
    priority: 2
    template: "Device footprint is shared across {shared_device_accounts} account(s) with {device_returns_30d} return(s) in the past 30 days."
    features:
      - shared_device_accounts
      - device_returns_30d
      - device_return_rate_30d

  RC_HIGH_RETURN_VELOCITY:
    title: "Elevated Return Velocity in Short Window"
    group: "velocity"
    severity: "HIGH"
    priority: 3
    template: "Customer initiated {returns_24h} return(s) in the last 24 hours ({returns_7d} in prior 7 days)."
    features:
      - returns_24h
      - returns_7d
      - returns_30d

  RC_RAPID_WARDROBING:
    title: "Suspected Wardrobing / Rapid Return"
    group: "return_behavior"
    severity: "MEDIUM"
    priority: 4
    template: "Return requested {days_to_return_current:.1f} day(s) post-delivery with elevated wardrobing risk score of {wardrobing_risk_score:.2f}."
    features:
      - wardrobing_risk_score
      - days_to_return_current
      - avg_days_to_return_user

  RC_EXCESSIVE_REFUND_RATIO:
    title: "Disproportionate Refund Volume"
    group: "transaction_value"
    severity: "MEDIUM"
    priority: 5
    template: "30-day refund ratio is {refund_ratio_30d:.1%} (requested refund amount ₹{refund_amount:.2f})."
    features:
      - refund_ratio_30d
      - refund_amount_30d
      - refund_amount

  RC_DISPROPORTIONATE_RETURN_LOSS:
    title: "Severe Expected Financial Loss"
    group: "transaction_value"
    severity: "MEDIUM"
    priority: 6
    template: "Estimated net return loss of ₹{estimated_return_loss:.2f} on order value ₹{order_amount:.2f}."
    features:
      - estimated_return_loss
      - order_amount
      - cogs
      - return_shipping_cost

  RC_CATEGORY_RETURN_ANOMALY:
    title: "Abnormal Category Return Rate"
    group: "return_behavior"
    severity: "LOW"
    priority: 7
    template: "User return rate for category exceeds baseline by {user_category_return_rate_diff:+.1%}."
    features:
      - user_category_return_rate_diff
      - return_rate_30d
      - category_return_rate_baseline

  RC_CHRONIC_RETURN_RATE:
    title: "Chronic Lifetime Return Profile"
    group: "return_behavior"
    severity: "MEDIUM"
    priority: 8
    template: "Customer has a 30-day return rate of {return_rate_30d:.1%} across {total_returns_all_time} total returns."
    features:
      - return_rate_30d
      - return_rate_all_time
      - total_returns_all_time

cold_start_rules:
  new_account:
    condition: "account_age_hours < 24.0 or is_first_purchase == 1.0"
    confidence: "LOW_COLD_START"
    description: "Account created within the last 24 hours or first purchase with limited historical transaction baseline."
  thin_history:
    condition: "user_history_count < 3 and user_history_count >= 1"
    confidence: "MEDIUM"
    description: "Sparse purchase history (less than 3 historical transactions recorded)."
  mature_history:
    condition: "user_history_count >= 3"
    confidence: "HIGH"
    description: "Established customer transaction history with high statistical confidence."
